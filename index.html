<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Responder Assistant // Tactical &amp; Ops Hub</title>
  <style>
    :root {
      --bg-base: #111418;
      --bg-surface: #181d23;
      --bg-card: #1e242c;
      --bg-card-hover: #252d37;
      --bg-input: #14181d;

      --border-soft: #2b333e;
      --border-accent: #3d4857;

      --text-primary: #eef2f6;
      --text-secondary: #b4bec9;
      --text-muted: #7c8694;

      --red: #d94848;
      --olive: #5f7a52;
      --amber: #d99b26;
      --sky: #55a8de;

      --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .top-stripe {
      height: 3px;
      background: linear-gradient(90deg, var(--red) 0%, var(--amber) 50%, var(--olive) 100%);
    }

    .topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-soft);
      padding: 13px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
    }

    .topbar-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: #242b35;
      border: 1px solid var(--border-accent);
      border-left: 3px solid var(--red);
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      margin: 1px 0 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .pill {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      padding: 5px 10px;
      border-radius: 5px;
    }

    .pill strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .main {
      padding: 18px 20px 36px;
    }

    .filter-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      color: var(--text-secondary);
      padding: 6px 11px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .filter-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-accent);
    }

    .filter-btn.active {
      background: rgba(85, 168, 222, 0.14);
      border-color: rgba(85, 168, 222, 0.55);
      color: #d7efff;
    }

    .search-box {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      color: var(--text-primary);
      padding: 6px 11px;
      border-radius: 5px;
      font-size: 12.5px;
      min-width: 230px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--sky);
    }

    .bay {
      margin-bottom: 22px;
    }

    .bay-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }

    .bay-name {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-primary);
    }

    .bay-hint {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 11px;
    }

    /* Active / Live Opaque Button */
    .tool-btn.is-active {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-left: 3px solid var(--olive);
      border-radius: 7px;
      padding: 12px 14px;
      color: var(--text-primary);
      opacity: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.12s ease;
    }

    .tool-btn.is-active:hover {
      background: var(--bg-card-hover);
      border-color: #546378;
      border-left-color: var(--sky);
      transform: translateY(-1px);
    }

    /* Inactive / Non-live Semi-Transparent Greyed Button */
    .tool-btn.is-disabled {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      background: #161a20;
      border: 1px solid #242a33;
      border-left: 3px solid #39414d;
      border-radius: 7px;
      padding: 12px 14px;
      color: var(--text-muted);
      opacity: 0.42;
      pointer-events: none;
      user-select: none;
      cursor: not-allowed;
    }

    .tool-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tool-cat {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .tool-title {
      margin: 4px 0 3px;
      font-size: 15px;
      font-weight: 700;
      color: inherit;
    }

    .tool-desc {
      margin: 0;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .tool-btn.is-disabled .tool-desc {
      color: var(--text-muted);
    }

    .tool-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--sky);
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tool-btn.is-disabled .tool-foot {
      color: var(--text-muted);
      font-weight: 500;
    }

    .tool-foot span:last-child {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .empty-state {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    .foot {
      border-top: 1px solid var(--border-soft);
      padding: 13px 20px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-surface);
    }

    .foot-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    code {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-secondary);
      background: var(--bg-input);
      padding: 1px 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="top-stripe"></div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <div class="brand-mark">OPS</div>
        <div>
          <h1 class="brand-title">First Responder Assistant</h1>
          <p class="brand-sub">Field &amp; Training Hub &bull; Standalone Tools &amp; Repositories</p>
        </div>
      </div>

      <div class="meta-pills">
        <div class="pill" id="countPill">Active: <strong>0</strong> / 0</div>
        <div class="pill">Target: <strong>New Tab</strong></div>
      </div>
    </div>
  </header>

  <main class="wrap main">
    <div class="filter-bar">
      <div class="filter-group" id="filterButtons">
        <button type="button" class="filter-btn active" data-mode="all" onclick="setMode('all')">All</button>
        <button type="button" class="filter-btn" data-mode="active" onclick="setMode('active')">Available</button>
        <button type="button" class="filter-btn" data-mode="offline" onclick="setMode('offline')">Offline</button>
      </div>

      <input
        type="search"
        class="search-box"
        id="searchInput"
        placeholder="Filter tools..."
        oninput="render()"
      />
    </div>

    <div id="bays"></div>
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <span>Standalone GitHub Pages repos launched in new tabs; updates in one tool do not affect others.</span>
      <span>Flip <code>active: true</code> and add <code>url</code> in <code>MODULES</code> as new repos go live.</span>
    </div>
  </footer>

  <script>
    const BAYS = [
      {
        id: "fire-scenarios",
        title: "Fireground & Scenarios",
        hint: "Hydraulics & multi-discipline scenario drills"
      },
      {
        id: "rescue-le-med",
        title: "Rescue, Police & Medical",
        hint: "Technical rescue, decision/case law & clinical aid"
      },
      {
        id: "training-repos",
        title: "Training, Checklists & Repos",
        hint: "Certification matrix, lesson plans, speech & built repositories"
      }
    ];

    const MODULES = [
      {
        id: "pump-aid",
        bay: "fire-scenarios",
        cat: "HYDRAULICS",
        title: "Firetruck Pump Aid",
        desc: "Friction loss, elevation, and pump discharge pressure calculations.",
        url: "https://gerber111213.github.io/Firetruck-Pump-Aid/",
        active: true
      },
      {
        id: "scenario-builder",
        bay: "fire-scenarios",
        cat: "SCENARIOS",
        title: "Scenario Creator",
        desc: "Build scenarios for pumping, command, medical, and rescue drills.",
        url: "",
        active: false
      },
      {
        id: "rescue-tools",
        bay: "rescue-le-med",
        cat: "TECH RESCUE",
        title: "Rope Rescue Math",
        desc: "Mechanical advantage, vectors, and technical rescue field math.",
        url: "https://gerber111213.github.io/Rope-Rescue-math/",
        active: true
      },
      {
        id: "medical-translator",
        bay: "rescue-le-med",
        cat: "CLINICAL",
        title: "Medical Translator",
        desc: "Rapid patient assessment and clinical phrase translation.",
        url: "https://gerber111213.github.io/Medical-translator/",
        active: true
      },
      {
        id: "police-pathway",
        bay: "rescue-le-med",
        cat: "CASE LAW & DECISIONS",
        title: "Police Pathway",
        desc: "Decision-making frameworks, authorities, and case law scenarios.",
        url: "",
        active: false
      },
      {
        id: "course-checklist",
        bay: "training-repos",
        cat: "CAREER MATRIX",
        title: "Firefighter Training Matrix",
        desc: "Certification checklist, prerequisite swimlanes, JSON save, and PDF.",
        url: "https://gerber111213.github.io/Firefighter-training-matrix/",
        active: true
      },
      {
        id: "speech-assistant",
        bay: "training-repos",
        cat: "COMMS & BRIEFINGS",
        title: "Speech Assistant",
        desc: "Structured briefings, announcements, and speaking support.",
        url: "https://gerber111213.github.io/speech-assistant/",
        active: true
      },
      {
        id: "lesson-planner",
        bay: "training-repos",
        cat: "INSTRUCTION",
        title: "Lesson Planner",
        desc: "Training outlines, objectives, apparatus/gear lists, and drill flow.",
        url: "",
        active: false
      },
      {
        id: "built-repos",
        bay: "training-repos",
        cat: "REPOSITORIES",
        title: "My Built Repos",
        desc: "Additional standalone repos and web builds.",
        url: "",
        active: false
      }
    ];

    let currentMode = "all";

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll("#filterButtons .filter-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
      render();
    }

    function render() {
      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const baysEl = document.getElementById("bays");

      const activeTotal = MODULES.filter((m) => m.active && m.url).length;
      document.getElementById("countPill").innerHTML =
        `Active: <strong>${activeTotal}</strong> / ${MODULES.length}`;

      const items = MODULES.filter((m) => {
        const isReady = Boolean(m.active && m.url);
        const modeMatch =
          currentMode === "all" ||
          (currentMode === "active" && isReady) ||
          (currentMode === "offline" && !isReady);

        const textMatch =
          !q ||
          `${m.title} ${m.cat} ${m.desc}`.toLowerCase().includes(q);

        return modeMatch && textMatch;
      });

      const html = BAYS.map((bay) => {
        const bayModules = items.filter((m) => m.bay === bay.id);
        if (!bayModules.length) return "";

        const cards = bayModules
          .map((m) => {
            const isReady = Boolean(m.active && m.url);
            if (isReady) {
              return `
                <a
                  class="tool-btn is-active"
                  href="${m.url}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  <div>
                    <div class="tool-top">
                      <span class="tool-cat">${m.cat}</span>
                    </div>
                    <h2 class="tool-title">${m.title}</h2>
                    <p class="tool-desc">${m.desc}</p>
                  </div>
                  <div class="tool-foot">
                    <span>Open Tool &rarr;</span>
                    <span>NEW TAB</span>
                  </div>
                </a>
              `;
            }

            return `
              <div
                class="tool-btn is-disabled"
                aria-disabled="true"
                tabindex="-1"
              >
                <div>
                  <div class="tool-top">
                    <span class="tool-cat">${m.cat}</span>
                  </div>
                  <h2 class="tool-title">${m.title}</h2>
                  <p class="tool-desc">${m.desc}</p>
                </div>
                <div class="tool-foot">
                  <span>Unavailable</span>
                  <span>OFFLINE</span>
                </div>
              </div>
            `;
          })
          .join("");

        return `
          <section class="bay">
            <div class="bay-head">
              <h2 class="bay-name">${bay.title}</h2>
              <span class="bay-hint">${bay.hint}</span>
            </div>
            <div class="grid">${cards}</div>
          </section>
        `;
      }).join("");

      baysEl.innerHTML =
        html ||
        `<div class="empty-state">No tools match your current filter or search.</div>`;
    }

    render();
  </script>
</body>
</html>
