<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Responder Assistant // Tactical &amp; Ops Hub</title>
  <style>
    :root {
      --bg-base: #111418;
      --bg-surface: #181d23;
      --bg-card: #1e242c;
      --bg-card-hover: #242b35;
      --bg-input: #14181d;

      --border-soft: #2b333e;
      --border-accent: #3b4654;

      --text-primary: #eef2f6;
      --text-secondary: #aeb7c2;
      --text-muted: #7c8694;

      --red: #d94848;
      --olive: #5f7a52;
      --amber: #d99b26;
      --sky: #4da3d9;

      --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle top duty stripe */
    .top-stripe {
      height: 3px;
      background: linear-gradient(90deg, var(--red) 0%, var(--amber) 50%, var(--olive) 100%);
    }

    .topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-soft);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
    }

    .topbar-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #252c36;
      border: 1px solid var(--border-accent);
      border-left: 3px solid var(--red);
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      margin: 1px 0 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .pill {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      padding: 5px 10px;
      border-radius: 5px;
    }

    .pill strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .main {
      padding: 18px 20px 36px;
    }

    /* Filter & Search Bar */
    .filter-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      color: var(--text-secondary);
      padding: 6px 11px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .filter-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-accent);
    }

    .filter-btn.active {
      background: rgba(217, 72, 72, 0.14);
      border-color: rgba(217, 72, 72, 0.55);
      color: #ffd6d6;
    }

    .search-box {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      color: var(--text-primary);
      padding: 6px 11px;
      border-radius: 5px;
      font-size: 12.5px;
      min-width: 230px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--sky);
    }

    /* Section Bays */
    .bay {
      margin-bottom: 22px;
    }

    .bay-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }

    .bay-name {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-primary);
    }

    .bay-hint {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* Compact Action Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 11px;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-left: 3px solid var(--border-accent);
      border-radius: 7px;
      padding: 12px 14px;
      color: var(--text-primary);
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.12s ease;
    }

    .tool-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-accent);
      transform: translateY(-1px);
    }

    .tool-btn.status-live {
      border-left-color: var(--olive);
    }

    .tool-btn.status-rework {
      border-left-color: var(--amber);
    }

    .tool-btn.status-build {
      border-left-color: var(--red);
    }

    .tool-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tool-cat {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }

    .badge-live {
      background: rgba(95, 122, 82, 0.22);
      color: #b7d4a8;
      border: 1px solid rgba(95, 122, 82, 0.45);
    }

    .badge-rework {
      background: rgba(217, 155, 38, 0.18);
      color: #f3cf83;
      border: 1px solid rgba(217, 155, 38, 0.42);
    }

    .badge-build {
      background: rgba(217, 72, 72, 0.18);
      color: #f2a7a7;
      border: 1px solid rgba(217, 72, 72, 0.42);
    }

    .tool-title {
      margin: 4px 0 3px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .tool-desc {
      margin: 0;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .tool-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--sky);
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tool-foot span:last-child {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .empty-state {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    .foot {
      border-top: 1px solid var(--border-soft);
      padding: 14px 20px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-surface);
    }

    .foot-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    code {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-secondary);
      background: var(--bg-input);
      padding: 1px 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="top-stripe"></div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <div class="brand-mark">OPS</div>
        <div>
          <h1 class="brand-title">First Responder Assistant</h1>
          <p class="brand-sub">Field &amp; Training Hub &bull; Standalone Tools &amp; Repositories</p>
        </div>
      </div>

      <div class="meta-pills">
        <div class="pill" id="countPill">Tools: <strong>0</strong></div>
        <div class="pill">Target: <strong>New Tab</strong></div>
      </div>
    </div>
  </header>

  <main class="wrap main">
    <div class="filter-bar">
      <div class="filter-group" id="filterButtons">
        <button type="button" class="filter-btn active" data-status="all" onclick="setFilter('all')">All</button>
        <button type="button" class="filter-btn" data-status="live" onclick="setFilter('live')">Live</button>
        <button type="button" class="filter-btn" data-status="rework" onclick="setFilter('rework')">Rework</button>
        <button type="button" class="filter-btn" data-status="build" onclick="setFilter('build')">To Build</button>
      </div>

      <input
        type="search"
        class="search-box"
        id="searchInput"
        placeholder="Filter tools..."
        oninput="render()"
      />
    </div>

    <div id="bays"></div>
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <span>Each button links to its own isolated repo/page so updates in one tool never break others.</span>
      <span>Edit <code>url</code> in <code>MODULES</code> to point to each GitHub Pages repo.</span>
    </div>
  </footer>

  <script>
    // Replace each `url` with your actual GitHub Pages URL, e.g.:
    // "https://gerber111213.github.io/your-repo-name/"
    const BAYS = [
      {
        id: "fire-scenarios",
        title: "Fireground & Scenarios",
        hint: "Hydraulics & multi-discipline scenario drills"
      },
      {
        id: "rescue-le-med",
        title: "Rescue, Police & Medical",
        hint: "Technical rescue, decision/case law & clinical aid"
      },
      {
        id: "training-repos",
        title: "Training, Checklists & Repos",
        hint: "Certification matrix, lesson plans & built repositories"
      }
    ];

    const MODULES = [
      {
        id: "pump-aid",
        bay: "fire-scenarios",
        cat: "HYDRAULICS",
        title: "Pump Aid",
        status: "live",
        desc: "Friction loss, elevation, and pump discharge pressure calculations.",
        url: "https://gerber111213.github.io/pump-aid/"
      },
      {
        id: "scenario-builder",
        bay: "fire-scenarios",
        cat: "SCENARIOS",
        title: "Scenario Creator",
        status: "build",
        desc: "Build scenarios for pumping, command, medical, and rescue drills.",
        url: "https://gerber111213.github.io/scenario-builder/"
      },
      {
        id: "rescue-tools",
        bay: "rescue-le-med",
        cat: "TECH RESCUE",
        title: "Rescue Tools",
        status: "rework",
        desc: "Mechanical advantage, vectors, and technical rescue field aids.",
        url: "https://gerber111213.github.io/rescue-tools/"
      },
      {
        id: "police-pathway",
        bay: "rescue-le-med",
        cat: "CASE LAW & DECISIONS",
        title: "Police Pathway",
        status: "build",
        desc: "Decision-making frameworks, authorities, and case law scenarios.",
        url: "https://gerber111213.github.io/police-pathway/"
      },
      {
        id: "medical-translator",
        bay: "rescue-le-med",
        cat: "CLINICAL",
        title: "Medical Translator",
        status: "rework",
        desc: "Rapid patient assessment and clinical phrase translation.",
        url: "https://gerber111213.github.io/medical-translator/"
      },
      {
        id: "course-checklist",
        bay: "training-repos",
        cat: "CAREER MATRIX",
        title: "Course Checklist & Matrix",
        status: "live",
        desc: "Certification checklist, prerequisite swimlanes, JSON save, and PDF.",
        url: "https://gerber111213.github.io/career-matrix/"
      },
      {
        id: "lesson-planner",
        bay: "training-repos",
        cat: "INSTRUCTION",
        title: "Lesson Planner",
        status: "build",
        desc: "Training outlines, objectives, apparatus/gear lists, and drill flow.",
        url: "https://gerber111213.github.io/lesson-planner/"
      },
      {
        id: "built-repos",
        bay: "training-repos",
        cat: "REPOSITORIES",
        title: "My Built Repos",
        status: "rework",
        desc: "Quick links to other standalone repos and web builds.",
        url: "https://gerber111213.github.io/"
      }
    ];

    let activeStatus = "all";

    function setFilter(status) {
      activeStatus = status;
      document.querySelectorAll("#filterButtons .filter-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.status === status);
      });
      render();
    }

    function badgeMarkup(status) {
      if (status === "live") return `<span class="badge badge-live">LIVE</span>`;
      if (status === "rework") return `<span class="badge badge-rework">REWORK</span>`;
      return `<span class="badge badge-build">TO BUILD</span>`;
    }

    function actionText(status) {
      if (status === "live") return "Open Tool";
      if (status === "rework") return "Open to Rework";
      return "Open Build Target";
    }

    function render() {
      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const baysEl = document.getElementById("bays");

      const items = MODULES.filter((m) => {
        const statusMatch = activeStatus === "all" || m.status === activeStatus;
        const textMatch =
          !q ||
          `${m.title} ${m.cat} ${m.desc} ${m.status}`.toLowerCase().includes(q);
        return statusMatch && textMatch;
      });

      document.getElementById("countPill").innerHTML =
        `Showing: <strong>${items.length}</strong> / ${MODULES.length}`;

      const html = BAYS.map((bay) => {
        const bayModules = items.filter((m) => m.bay === bay.id);
        if (!bayModules.length) return "";

        const cards = bayModules
          .map(
            (m) => `
            <a
              class="tool-btn status-${m.status}"
              href="${m.url}"
              target="_blank"
              rel="noopener noreferrer"
            >
              <div>
                <div class="tool-top">
                  <span class="tool-cat">${m.cat}</span>
                  ${badgeMarkup(m.status)}
                </div>
                <h2 class="tool-title">${m.title}</h2>
                <p class="tool-desc">${m.desc}</p>
              </div>
              <div class="tool-foot">
                <span>${actionText(m.status)} &rarr;</span>
                <span>NEW TAB</span>
              </div>
            </a>
          `
          )
          .join("");

        return `
          <section class="bay">
            <div class="bay-head">
              <h2 class="bay-name">${bay.title}</h2>
              <span class="bay-hint">${bay.hint}</span>
            </div>
            <div class="grid">${cards}</div>
          </section>
        `;
      }).join("");

      baysEl.innerHTML =
        html ||
        `<div class="empty-state">No modules match your current filter or search.</div>`;
    }

    render();
  </script>
</body>
</html>
