<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Responder Assistant // Tactical &amp; Ops Hub</title>
  <style>
    :root {
      --bg-base: #111418;
      --bg-surface: #181d23;
      --bg-card: #1e242c;
      --bg-card-hover: #252d37;
      --bg-input: #14181d;

      --border-soft: #2b333e;
      --border-accent: #3d4857;

      --text-primary: #eef2f6;
      --text-secondary: #b4bec9;
      --text-muted: #7c8694;

      --red: #d94848;
      --olive: #5f7a52;
      --amber: #d99b26;
      --sky: #55a8de;

      --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .top-stripe {
      height: 3px;
      background: linear-gradient(90deg, var(--red) 0%, var(--amber) 50%, var(--olive) 100%);
    }

    .topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-soft);
      padding: 13px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .wrap {
      max-width: 1480px;
      margin: 0 auto;
    }

    .topbar-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: #242b35;
      border: 1px solid var(--border-accent);
      border-left: 3px solid var(--red);
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      margin: 1px 0 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .pill {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      padding: 5px 10px;
      border-radius: 5px;
    }

    .pill strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .main {
      padding: 18px 20px 36px;
    }

    .filter-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      color: var(--text-secondary);
      padding: 6px 11px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .filter-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-accent);
    }

    .filter-btn.active {
      background: rgba(85, 168, 222, 0.14);
      border-color: rgba(85, 168, 222, 0.55);
      color: #d7efff;
    }

    .search-box {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      color: var(--text-primary);
      padding: 6px 11px;
      border-radius: 5px;
      font-size: 12.5px;
      min-width: 230px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--sky);
    }

    /* 5-Column Discipline Layout */
    .columns-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }

    .col-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--border-soft);
    }

    .col-header-main {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .col-graphic {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .col-graphic svg {
      width: 16px;
      height: 16px;
    }

    .col-title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .col-sub {
      margin: 1px 0 0;
      font-size: 11px;
      color: var(--text-muted);
    }

    .col-header-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      color: var(--sky);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 4px 7px;
      border-radius: 5px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    }

    .col-header-link:hover {
      background: var(--bg-card-hover);
      border-color: var(--sky);
      color: #d7efff;
    }

    /* Active / Live Opaque Button */
    .tool-btn.is-active {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-left: 3px solid var(--olive);
      border-radius: 7px;
      padding: 11px 12px;
      color: var(--text-primary);
      opacity: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.12s ease;
    }

    .tool-btn.is-active:hover {
      background: var(--bg-card-hover);
      border-color: #546378;
      border-left-color: var(--sky);
      transform: translateY(-1px);
    }

    /* Inactive / Non-live Semi-Transparent Greyed Button */
    .tool-btn.is-disabled {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      background: #161a20;
      border: 1px solid #242a33;
      border-left: 3px solid #39414d;
      border-radius: 7px;
      padding: 11px 12px;
      color: var(--text-muted);
      opacity: 0.42;
      pointer-events: none;
      user-select: none;
      cursor: not-allowed;
    }

    .tool-cat {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      display: block;
    }

    .tool-title {
      margin: 3px 0 3px;
      font-size: 14px;
      font-weight: 700;
      color: inherit;
    }

    .tool-desc {
      margin: 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .tool-btn.is-disabled .tool-desc {
      color: var(--text-muted);
    }

    .tool-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--sky);
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tool-btn.is-disabled .tool-foot {
      color: var(--text-muted);
      font-weight: 500;
    }

    .tool-foot span:last-child {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .empty-col {
      padding: 14px 10px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
      border: 1px dashed var(--border-soft);
      border-radius: 6px;
    }

    .foot {
      border-top: 1px solid var(--border-soft);
      padding: 13px 20px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-surface);
    }

    .foot-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    code {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-secondary);
      background: var(--bg-input);
      padding: 1px 5px;
      border-radius: 4px;
    }

    @media (max-width: 1220px) {
      .columns-board {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 780px) {
      .columns-board {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="top-stripe"></div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <div class="brand-mark">OPS</div>
        <div>
          <h1 class="brand-title">First Responder Assistant</h1>
          <p class="brand-sub">Field &amp; Training Hub &bull; Standalone Tools &amp; Repositories</p>
        </div>
      </div>

      <div class="meta-pills">
        <div class="pill" id="countPill">Active: <strong>0</strong> / 0</div>
        <div class="pill">Target: <strong>New Tab</strong></div>
      </div>
    </div>
  </header>

  <main class="wrap main">
    <div class="filter-bar">
      <div class="filter-group" id="filterButtons">
        <button type="button" class="filter-btn active" data-mode="all" onclick="setMode('all')">All</button>
        <button type="button" class="filter-btn" data-mode="active" onclick="setMode('active')">Available</button>
        <button type="button" class="filter-btn" data-mode="offline" onclick="setMode('offline')">Offline</button>
      </div>

      <input
        type="search"
        class="search-box"
        id="searchInput"
        placeholder="Filter tools..."
        oninput="render()"
      />
    </div>

    <div class="columns-board" id="columnsBoard"></div>
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <span>Standalone GitHub Pages repos launched in new tabs; updates in one tool do not affect others.</span>
      <span>Flip <code>active: true</code> and add <code>url</code> in <code>MODULES</code> as new repos go live.</span>
    </div>
  </footer>

  <script>
    const COLUMNS = [
      {
        id: "fire",
        title: "Fire",
        sub: "Hydraulics & fireground",
        icon: `
          <svg viewBox="0 0 24 24" fill="none" stroke="#d94848" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3c2.5 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4.5 2.5-6 .2 1.8 1.2 2.5 2.5 2.5 0-2.5 0-4.5 0-6.5z"/>
          </svg>
        `
      },
      {
        id: "rescue",
        title: "Rescue",
        sub: "Technical & decision aids",
        icon: `
          <svg viewBox="0 0 24 24" fill="none" stroke="#d99b26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="8"/>
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 4v5M12 15v5M4 12h5M15 12h5"/>
          </svg>
        `
      },
      {
        id: "medical",
        title: "Medical",
        sub: "Patient & clinical comms",
        icon: `
          <svg viewBox="0 0 24 24" fill="none" stroke="#5f7a52" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        `
      },
      {
        id: "police",
        title: "Police",
        sub: "Decisions & case law",
        icon: `
          <svg viewBox="0 0 24 24" fill="none" stroke="#55a8de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l7 3v6c0 5-3.2 8.2-7 9-3.8-.8-7-4-7-9V6l7-3z"/>
          </svg>
        `
      },
      {
        id: "training",
        title: "Training",
        sub: "Matrices, plans & comms",
        headerLink: {
          label: "Scenarios ↗",
          title: "Scenario Builder",
          desc: "Build pumping, command, medical, and rescue drill scenarios.",
          cat: "SCENARIOS",
          url: "https://gerber111213.github.io/Scenario-builder/"
        },
        icon: `
          <svg viewBox="0 0 24 24" fill="none" stroke="#b4bec9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        `
      }
    ];

    const MODULES = [
      // Fire
      {
        id: "pump-aid",
        col: "fire",
        cat: "HYDRAULICS",
        title: "Pump Aid",
        desc: "Friction loss, elevation, and pump discharge pressure calculations.",
        url: "https://gerber111213.github.io/Firetruck-Pump-Aid/",
        active: true
      },

      // Rescue
      {
        id: "rescue-decision-maker",
        col: "rescue",
        cat: "ROPE & RESCUE MATH",
        title: "Rescue decision maker",
        desc: "Mechanical advantage, vectors, and technical rescue decision support.",
        url: "https://gerber111213.github.io/Rope-Rescue-math/",
        active: true
      },

      // Medical
      {
        id: "medical-translator",
        col: "medical",
        cat: "CLINICAL",
        title: "Medical Translator",
        desc: "Rapid patient assessment and clinical phrase translation.",
        url: "https://gerber111213.github.io/Medical-translator/",
        active: true
      },

      // Police
      {
        id: "police-decision-pathway",
        col: "police",
        cat: "CASE LAW & DECISIONS",
        title: "Police decision pathway",
        desc: "Decision-making frameworks, authorities, and case law scenarios.",
        url: "https://gerber111213.github.io/Case-law-guide/",
        active: true
      },

      // Training
      {
        id: "course-checklist",
        col: "training",
        cat: "CAREER MATRIX",
        title: "Course Checklist & Matrix",
        desc: "Certification checklist, prerequisite swimlanes, JSON save, and PDF.",
        url: "https://gerber111213.github.io/Firefighter-training-matrix/",
        active: true
      },
      {
        id: "speech-assistant",
        col: "training",
        cat: "COMMS & BRIEFINGS",
        title: "Speech Assistant",
        desc: "Structured briefings, announcements, and speaking support.",
        url: "https://gerber111213.github.io/speech-assistant/",
        active: true
      },
      {
        id: "lesson-planner",
        col: "training",
        cat: "INSTRUCTION",
        title: "Lesson Planner",
        desc: "Training outlines, objectives, apparatus/gear lists, and drill flow.",
        url: "",
        active: false
      }
    ];

    let currentMode = "all";

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll("#filterButtons .filter-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
      render();
    }

    function render() {
      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const board = document.getElementById("columnsBoard");

      const headerLinksCount = COLUMNS.filter((c) => c.headerLink && c.headerLink.url).length;
      const activeModulesCount = MODULES.filter((m) => m.active && m.url).length;
      const activeTotal = activeModulesCount + headerLinksCount;
      const totalItems = MODULES.length + headerLinksCount;

      document.getElementById("countPill").innerHTML =
        `Active: <strong>${activeTotal}</strong> / ${totalItems}`;

      const items = MODULES.filter((m) => {
        const isReady = Boolean(m.active && m.url);
        const modeMatch =
          currentMode === "all" ||
          (currentMode === "active" && isReady) ||
          (currentMode === "offline" && !isReady);

        const textMatch =
          !q ||
          `${m.title} ${m.cat} ${m.desc}`.toLowerCase().includes(q);

        return modeMatch && textMatch;
      });

      const colsHtml = COLUMNS.map((col) => {
        const colModules = items.filter((m) => m.col === col.id);
        const showHeaderLink =
          col.headerLink &&
          col.headerLink.url &&
          currentMode !== "offline" &&
          (!q ||
            `${col.headerLink.title} ${col.headerLink.label} ${col.headerLink.cat} ${col.headerLink.desc}`
              .toLowerCase()
              .includes(q));

        const headerLinkHtml = showHeaderLink
          ? `
            <a
              class="col-header-link"
              href="${col.headerLink.url}"
              target="_blank"
              rel="noopener noreferrer"
              title="${col.headerLink.title} (Opens in new tab)"
            >${col.headerLink.label}</a>
          `
          : "";

        const cardsHtml = colModules.length
          ? colModules
              .map((m) => {
                const isReady = Boolean(m.active && m.url);
                if (isReady) {
                  return `
                    <a
                      class="tool-btn is-active"
                      href="${m.url}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      <div>
                        <span class="tool-cat">${m.cat}</span>
                        <h2 class="tool-title">${m.title}</h2>
                        <p class="tool-desc">${m.desc}</p>
                      </div>
                      <div class="tool-foot">
                        <span>Open Tool &rarr;</span>
                        <span>NEW TAB</span>
                      </div>
                    </a>
                  `;
                }

                return `
                  <div
                    class="tool-btn is-disabled"
                    aria-disabled="true"
                    tabindex="-1"
                  >
                    <div>
                      <span class="tool-cat">${m.cat}</span>
                      <h2 class="tool-title">${m.title}</h2>
                      <p class="tool-desc">${m.desc}</p>
                    </div>
                    <div class="tool-foot">
                      <span>Unavailable</span>
                      <span>OFFLINE</span>
                    </div>
                  </div>
                `;
              })
              .join("")
          : `<div class="empty-col">No matching tools</div>`;

        return `
          <section class="col-panel" aria-label="${col.title}">
            <div class="col-header">
              <div class="col-header-main">
                <div class="col-graphic">${col.icon}</div>
                <div>
                  <h2 class="col-title">${col.title}</h2>
                  <p class="col-sub">${col.sub}</p>
                </div>
              </div>
              ${headerLinkHtml}
            </div>
            ${cardsHtml}
          </section>
        `;
      }).join("");

      board.innerHTML = colsHtml;
    }

    render();
  </script>
</body>
</html>
